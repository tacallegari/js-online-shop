<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Online Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="title-page-container">
            <h1>JS Online Shop</h1>
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome to Our Online Shop</h2>
            <p>Explore our featured product below.</p>
        </section>

        <section id="shop">
            <h2>Shop</h2>
            <p>Our featured product will be available here.</p>
        </section>

        <section id="cart">
            <h2>Shopping Cart</h2>
            <!-- Added id="cart-count" here so JavaScript can easily update both locations if needed -->
            <p>Items in cart: <span id="cart-count">0</span></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
